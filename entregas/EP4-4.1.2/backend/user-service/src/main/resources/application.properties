# Cuentas de Usuarios: servidor y base H2 persistente.
spring.application.name=oyl-user-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/oyl-users;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Registra este microservicio y consulta servicios por Eureka.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${OYL_DISCOVERY_HOST:127.0.0.1}

# La dirección de la ficha es pública; el tráfico interno sigue usando Eureka.
eureka.instance.status-page-url=${OYL_PUBLIC_GATEWAY:http://localhost:8080}/api/health/users
eureka.instance.home-page-url=${eureka.instance.status-page-url}
eureka.instance.health-check-url-path=/api/health
eureka.client.registry-fetch-interval-seconds=5
