# Registro Eureka local; el servidor no se registra como cliente.
spring.application.name=oyl-eureka-server
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8761
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

eureka.server.response-cache-update-interval-ms=3000
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Una sola instancia local: no anunciarse como una réplica de sí misma.
eureka.instance.hostname=localhost
