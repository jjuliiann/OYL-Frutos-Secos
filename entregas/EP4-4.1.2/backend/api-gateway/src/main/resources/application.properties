# Gateway: única puerta de entrada de Android.
spring.application.name=oyl-api-gateway
server.port=8080
# Autenticación y perfiles -> Usuarios.
spring.cloud.gateway.routes[0].id=users
spring.cloud.gateway.routes[0].uri=lb://oyl-user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/health,/api/auth/**,/api/users/**
# Catálogo, inventario y puntos -> Productos.
spring.cloud.gateway.routes[1].id=products
spring.cloud.gateway.routes[1].uri=lb://oyl-product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**,/api/locations
# Compras y estados -> Pedidos.
spring.cloud.gateway.routes[2].id=orders
spring.cloud.gateway.routes[2].uri=lb://oyl-order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**
management.endpoints.web.exposure.include=health,info

# Registra este microservicio y consulta servicios por Eureka.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${OYL_DISCOVERY_HOST:127.0.0.1}

# El Gateway conserva rutas explícitas y resuelve sus destinos mediante Eureka.

# La dirección de la ficha es pública; el tráfico interno sigue usando Eureka.
eureka.instance.status-page-url=${OYL_PUBLIC_GATEWAY:http://localhost:8080}/actuator/health
eureka.instance.home-page-url=${eureka.instance.status-page-url}
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.gateway.routes[3].id=health-users
spring.cloud.gateway.routes[3].uri=lb://oyl-user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/health/users
spring.cloud.gateway.routes[3].filters[0]=SetPath=/api/health
spring.cloud.gateway.routes[4].id=health-products
spring.cloud.gateway.routes[4].uri=lb://oyl-product-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/health/products
spring.cloud.gateway.routes[4].filters[0]=SetPath=/api/health
spring.cloud.gateway.routes[5].id=health-orders
spring.cloud.gateway.routes[5].uri=lb://oyl-order-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/health/orders
spring.cloud.gateway.routes[5].filters[0]=SetPath=/api/health
